<!DOCTYPE html>

<html>
<head>
  <meta http-equiv="CONTENT-TYPE" content="text/html; charset=UTF-8">
  <title>Id Card</title>
  <link rel="stylesheet" href="idcard.css">
</head>
<body>
  <div class="card-container">
    <div class="id-card">
      <header class="card-header">
        <img src="logo.jpeg" alt="logo" class="logo">
        <p>OU (Autonomous)</p>
      </header>
      <div class="photo-wrap">
        <img src="Photo.jpeg" alt="profile photo" class="photo">
      </div>
        <main class="card-body">
          <div class="name-section">
            <h2 class="student-name">Sangenaveni Sindhu Priya</h2>
            <p class="college">Vivekananda Government Degree College</p>
          </div>
          <hr>
        <div class="details">
          <p><strong>Course :</strong>Bsc(physical science)</p>
          <p><strong>Birthdate :</strong>07-11-2006</p>
        </div>
        <div class="id-line">
          <p><strong>Roll no:</strong>1244-24-467-016</p>
        </div>
        <div class="barcode"></div>
        </main>
      <footer class="card-footer">
        <p><strong>AY : 2024-2027</strong></p>
      </footer>
    </div>
  </div>
</body>
</html>
